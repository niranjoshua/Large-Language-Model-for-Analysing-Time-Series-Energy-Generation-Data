[project]
name = "vaticore"
version = "0.1.0"
description = "Probabilistic energy forecasting for mini-grid and C&I solar operators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "httpx>=0.27",
    "duckdb>=1.0",
]

[project.optional-dependencies]
# Heavier or service-only extras, kept out of the core so the pipeline stays light.
models = ["xgboost>=2.0", "torch>=2.2"]
service = ["fastapi>=0.111", "uvicorn>=0.30"]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
tracking = ["mlflow>=2.14"]
weather = ["httpx>=0.27"]
copilot = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaticore"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["vaticore", "tests"]

[tool.ruff.lint]
# A pragmatic, strict-ish default. E501 is handled by the formatter.
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vaticore"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses callables in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
packages = ["vaticore"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# Third party libraries without type stubs.
[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "sklearn.*",
    "pandera.*",
    "mlflow.*",
    "streamlit.*",
    "fastapi.*",
    "plotly.*",
    "uvicorn.*",
    "anthropic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
